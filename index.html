<style>
/* VOICE: a cheerful allotment almanac turned into a pocket game; warm, characterful, never shouty.
   IDEA: a raised bed of dark, freshly dug soil in a Cotswold stone frame; bright crops are the pieces, Poppy is the commentator.
   PICTURE: the 9x9 board itself, as large as the phone allows, under a slim almanac masthead.
   COLOUR and TYPE: Almanac paper, ink, plot green and stone round the edge; dark soil board so the six crop colours carry. IM Fell titles, Caslon tips, Fredoka numbers.
   LAYOUT: one column: masthead, goals/moves/score, board, Poppy, two buttons. Overlays for start, win and lose. */
:root{color-scheme:light dark;
  --bg:light-dark(#2e4a35,#1a2a1f);--on-bg:#f2ead8;--on-bg-muted:#c3d2b8;--card:light-dark(#f8f2e3,#212820);--ink:light-dark(#2a2f26,#ece5d0);--muted:light-dark(#5a5f50,#aab09a);
  --green:light-dark(#33503c,#a9cc9b);--stone:#d8c08a;--deep:#8a7038;--timber:#3a2a1c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background-color:var(--bg);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 44px,rgba(0,0,0,0) 44px 88px);color:var(--ink);font:16px/1.45 "Libre Caslon Text",Georgia,serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #f6c94a;outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:10px;min-height:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ib{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--green);background:var(--card);display:grid;place-items:center;padding:0}
.ib svg{width:21px;height:21px}
.ttl{text-align:center;line-height:1.1}
.ttl small{display:block;font-size:13px;color:var(--on-bg-muted)}
.ttl b{font:400 25px/1.05 "IM Fell English",Georgia,serif;color:var(--on-bg)}
.hud{display:grid;grid-template-columns:1.15fr .75fr 1.15fr;gap:8px}
.hc{background:var(--card);border:1.5px solid var(--green);border-radius:14px;box-shadow:0 3px 0 var(--deep);padding:7px 10px;display:flex;flex-direction:column;gap:4px;justify-content:center}
.hc .lab{font-size:13px;color:var(--muted)}
.num{font:600 19px/1.05 Fredoka,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.goal{display:flex;align-items:center;gap:6px}
.goal svg{width:24px;height:24px;flex:none}
.mv{background:#1d2e22;color:#f5efde;border:2px solid #d8c08a;box-shadow:0 3px 0 #8a7038;align-items:center}
.mv .num{font-size:36px;font-weight:700}
.mv i{font:italic 15px/1 "IM Fell English",Georgia,serif}
.mv.low{background:#a03f29;box-shadow:0 3px 0 #5d2416}
.meter{position:relative;height:10px;background:light-dark(#e6dcbf,#3a4433);border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:#33503c;transition:width .3s}
.leaves{display:flex;gap:3px}
.leaves svg{width:17px;height:17px}
.frame{align-self:center;border:2px solid #1d2e22;box-shadow:0 6px 0 rgba(0,0,0,.25);padding:5px;background:var(--stone);margin-top:2px}
.frame.shake{animation:shake .32s}
.frame.shake2{animation:shake2 .5s}
@keyframes shake{20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,-1px)}80%{transform:translate(2px,1px)}}
@keyframes shake2{10%{transform:translate(-6px,3px) rotate(-.4deg)}25%{transform:translate(6px,-4px) rotate(.4deg)}40%{transform:translate(-5px,-2px)}55%{transform:translate(4px,3px)}75%{transform:translate(-2px,1px)}}
.bed{position:relative;background:var(--timber);padding:4px;border-radius:3px}
.board{position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.fxl{position:absolute;left:4px;top:4px;pointer-events:none;z-index:6}
.cells{position:absolute;inset:0;display:grid}
.cell{position:relative}
.cell svg{position:absolute;inset:0;width:100%;height:100%}
.tile{position:absolute;left:0;top:0;transition:transform .17s ease;will-change:transform}
.tile .in{width:100%;height:100%;transition:transform .12s}
.tile svg{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
.tile.sel .in{transform:scale(1.15);filter:drop-shadow(0 0 5px #ffe27a)}
.tile .in.sp{animation:glow 1.1s ease-in-out infinite alternate}
.tile .in.pop{animation:pop .24s ease-in forwards}
.tile .in.grow{animation:grow .38s ease-out}
.tile .in.hint{animation:wig .9s ease-in-out 3}
.tile .in.primed{animation:pulse .4s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 1px #ffe27a)}to{filter:drop-shadow(0 0 7px #ffe27a)}}
@keyframes pop{35%{transform:scale(1.3)}to{transform:scale(0);opacity:0}}
@keyframes grow{from{transform:scale(.2) rotate(-20deg)}60%{transform:scale(1.35) rotate(6deg)}to{transform:scale(1)}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.1)}75%{transform:rotate(12deg) scale(1.1)}}
@keyframes pulse{to{transform:scale(1.18);filter:drop-shadow(0 0 9px #ffe27a)}}
.fx{position:absolute}
.fx.line{border-radius:999px;background:linear-gradient(90deg,rgba(255,226,122,0),#fffbe6 25%,#ffe27a 50%,#fffbe6 75%,rgba(255,226,122,0));box-shadow:0 0 18px 6px rgba(255,226,122,.7);animation:sweep .42s ease-out forwards}
.fx.ring{border-radius:50%;border:8px solid #ffe27a;box-shadow:0 0 24px 8px rgba(255,190,80,.7),inset 0 0 20px rgba(255,226,122,.8);animation:ring .48s ease-out forwards}
